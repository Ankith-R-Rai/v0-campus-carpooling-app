<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
  <!-- Cream background -->
  <rect width="1024" height="1024" fill="#F5EFE0"/>
  
  <!-- Motion lines on left -->
  <g stroke="#2C3E50" stroke-width="20" stroke-linecap="round">
    <line x1="120" y1="280" x2="360" y2="280"/>
    <line x1="140" y1="360" x2="400" y2="360"/>
    <line x1="160" y1="440" x2="360" y2="440"/>
    <line x1="140" y1="520" x2="380" y2="520"/>
    <line x1="120" y1="600" x2="360" y2="600"/>
  </g>
  
  <!-- Car body in turquoise -->
  <g>
    <!-- Main car shape -->
    <path d="M 350 420 L 500 350 L 700 350 L 800 420 L 800 550 Q 800 620 750 620 L 350 620 Q 300 620 300 550 Z" fill="#20C997" stroke="#2C3E50" stroke-width="24"/>
    
    <!-- Car window -->
    <ellipse cx="550" cy="380" rx="120" ry="60" fill="#3C4E5F" opacity="0.6"/>
    
    <!-- Car door line -->
    <line x1="550" y1="420" x2="550" y2="620" stroke="#2C3E50" stroke-width="20"/>
    
    <!-- Door handle -->
    <circle cx="450" cy="500" r="16" fill="#9CA3AC"/>
    
    <!-- Wheels -->
    <circle cx="380" cy="620" r="70" fill="#2C3E50" stroke="#9CA3AC" stroke-width="20"/>
    <circle cx="720" cy="620" r="70" fill="#2C3E50" stroke="#9CA3AC" stroke-width="20"/>
    
    <!-- Wheel centers -->
    <circle cx="380" cy="620" r="30" fill="#20C997"/>
    <circle cx="720" cy="620" r="30" fill="#20C997"/>
  </g>
  
  <!-- "H" text on left side -->
  <g fill="#2C3E50">
    <text x="240" y="480" font-size="280" font-weight="bold" font-family="Arial, sans-serif" text-anchor="middle">H</text>
  </g>
  
  <!-- Bottom banner -->
  <rect x="200" y="700" width="624" height="140" rx="40" fill="#20C997" stroke="#2C3E50" stroke-width="24"/>
  
  <!-- HOPPER text -->
  <text x="512" y="785" font-size="120" font-weight="bold" font-family="Arial, sans-serif" text-anchor="middle" fill="white" letter-spacing="8">HOPPER</text>
</svg>
